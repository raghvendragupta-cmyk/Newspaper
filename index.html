<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ownly Operations Gazette</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0c0d10; }

    /* =========================================
       1. TEASER SCREEN (DYNAMIC PATH)
       ========================================= */
    #teaser-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1e1e24 0%, #090a0c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      overflow: hidden;
    }

    .scooter-glider {
      position: absolute;
      width: 400px;
      height: 260px;
      animation: driveWavyPath 10s ease-in-out infinite alternate;
      filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.6));
    }

    @keyframes driveWavyPath {
      0% { transform: translate(-420px, 15vh) rotate(5deg) scale(0.9); }
      25% { transform: translate(25vw, -10vh) rotate(-8deg) scale(1.1); }
      50% { transform: translate(55vw, 20vh) rotate(10deg) scale(1.0); }
      75% { transform: translate(75vw, -5vh) rotate(-5deg) scale(1.15); }
      100% { transform: translate(105vw, 10vh) rotate(3deg) scale(0.95); }
    }

    .wheel { animation: spinWheel 0.25s linear infinite; transform-origin: center; }
    @keyframes spinWheel { 100% { transform: rotate(360deg); } }

    .teaser-banner {
      position: relative;
      z-index: 100;
      background: linear-gradient(135deg, #FF2E93, #FF6B00);
      color: white;
      padding: 18px 50px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 12px 35px rgba(255, 46, 147, 0.45);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      letter-spacing: 0.5px;
    }

    #teaser-screen:hover .teaser-banner { 
      transform: scale(1.08); 
      box-shadow: 0 15px 45px rgba(255, 46, 147, 0.65);
    }
    
    .teaser-hint { 
      position: relative;
      z-index: 100;
      color: #A1A1AA; 
      margin-top: 16px; 
      font-size: 15px; 
      letter-spacing: 0.5px; 
    }

    /* =========================================
       2. FLIPHTML5 CONTAINER & WATERMARK MASK
       ========================================= */
    #flipbook-wrapper {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
    }

    .brand-mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 280px;
      height: 52px;
      background: linear-gradient(135deg, #FF2E93 0%, #D9006C 100%);
      z-index: 10;
      display: flex;
      align-items: center;
      padding-left: 18px;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.8px;
      border-bottom-right-radius: 12px;
      box-shadow: 0 6px 20px rgba(255, 46, 147, 0.4);
      pointer-events: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* =========================================
       3. FLOATING FEEDBACK BUTTON & MODAL
       ========================================= */
    .feedback-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, #FF2E93, #D9006C);
      color: #FFF;
      padding: 14px 26px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 8px 25px rgba(255, 46, 147, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .feedback-btn:hover { 
      transform: scale(1.06); 
      box-shadow: 0 12px 30px rgba(255, 46, 147, 0.7);
    }

    #feedback-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 520px;
      height: 80vh;
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .close-modal {
      position: absolute;
      top: 12px; 
      right: 18px;
      font-size: 28px;
      cursor: pointer;
      color: #333;
      font-weight: bold;
      z-index: 11;
    }
  </style>
</head>
<body>

  <!-- 1. INTRO / TEASER OVERLAY -->
  <div id="teaser-screen" onclick="revealFlipbook()">
    <div class="scooter-glider">
      <svg viewBox="0 0 500 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="scooterYellow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFE600"/>
            <stop offset="100%" stop-color="#F59E0B"/>
          </linearGradient>
          <linearGradient id="pinkShirt" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF2E93"/>
            <stop offset="100%" stop-color="#D9006C"/>
          </linearGradient>
          <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
          </filter>
        </defs>

        <g class="wheel" style="transform-origin: 120px 240px;">
          <circle cx="120" cy="240" r="38" fill="#1C1917" stroke="#44403C" stroke-width="8"/>
          <circle cx="120" cy="240" r="22" fill="#D6D3D1"/>
          <circle cx="120" cy="240" r="8" fill="#1C1917"/>
          <line x1="120" y1="202" x2="120" y2="278" stroke="#78716C" stroke-width="3"/>
          <line x1="84" y1="240" x2="156" y2="240" stroke="#78716C" stroke-width="3"/>
        </g>
        
        <g class="wheel" style="transform-origin: 360px 240px;">
          <circle cx="360" cy="240" r="38" fill="#1C1917" stroke="#44403C" stroke-width="8"/>
          <circle cx="360" cy="240" r="22" fill="#D6D3D1"/>
          <circle cx="360" cy="240" r="8" fill="#1C1917"/>
          <line x1="360" y1="202" x2="360" y2="278" stroke="#78716C" stroke-width="3"/>
          <line x1="324" y1="240" x2="396" y2="240" stroke="#78716C" stroke-width="3"/>
        </g>

        <rect x="80" y="225" width="55" height="18" rx="9" fill="#57534E"/>
        <path d="M 120 230 L 220 230 L 210 200 L 140 180 Z" fill="#27272A"/>

        <path d="M 110 220 C 100 160, 160 140, 240 160 C 270 170, 290 220, 340 220 L 370 220 C 380 220, 385 210, 375 190 L 340 120 C 335 110, 325 105, 315 105 L 290 105" fill="url(#scooterYellow)" filter="url(#shadow)"/>
        <path d="M 200 235 L 310 235 L 320 220 L 210 220 Z" fill="#18181B"/>
        <path d="M 325 210 C 325 180, 385 180, 395 215 Z" fill="url(#scooterYellow)"/>

        <path d="M 335 130 L 320 65 L 295 65" stroke="#A1A1AA" stroke-width="12" stroke-linecap="round"/>
        <circle cx="325" cy="62" r="14" fill="url(#scooterYellow)"/>
        <circle cx="333" cy="60" r="7" fill="#FEF08A"/>

        <path d="M 150 160 C 150 145, 230 145, 245 160 C 220 168, 170 168, 150 160 Z" fill="#18181B"/>

        <path d="M 200 155 L 230 215 L 270 215" stroke="#27272A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 180 155 C 175 110, 200 90, 220 90 C 240 90, 245 110, 235 155 Z" fill="url(#pinkShirt)"/>
        <text x="188" y="125" fill="#FFFFFF" font-size="11" font-weight="900" font-family="sans-serif" letter-spacing="1">OWNLY</text>

        <path d="M 210 100 L 290 70" stroke="url(#pinkShirt)" stroke-width="14" stroke-linecap="round"/>
        <circle cx="292" cy="70" r="7" fill="#FCA5A5"/>

        <circle cx="215" cy="65" r="22" fill="#27272A"/>
        <path d="M 215 43 C 230 43, 237 53, 237 65 L 215 65 Z" fill="url(#pinkShirt)"/>
        <path d="M 225 60 L 236 60 L 233 72 L 222 72 Z" fill="#000000"/>

        <rect x="70" y="110" width="85" height="75" rx="10" fill="url(#pinkShirt)" stroke="#FFFFFF" stroke-width="3" filter="url(#shadow)"/>
        <rect x="80" y="120" width="65" height="55" rx="6" fill="rgba(255,255,255,0.15)"/>
        <text x="85" y="145" fill="#FFFFFF" font-size="12" font-weight="900" font-family="sans-serif">OWNLY</text>
        <text x="85" y="160" fill="#FFFFFF" font-size="10" font-weight="700" font-family="sans-serif">GAZETTE</text>
      </svg>
    </div>

    <div class="teaser-banner">🛵 Ownly News Letter</div>
    <div class="teaser-hint">Click anywhere to open the interactive magazine</div>
  </div>

  <!-- 2. FLIPHTML5 LIVE EMBED -->
  <div id="flipbook-wrapper">
    <div class="brand-mask">📰 Ownly Gazette</div>
    <iframe src="https://online.fliphtml5.com/hvxsc/1-SnF5/" allowfullscreen="true"></iframe>
  </div>

  <!-- 3. FLOATING FEEDBACK BUTTON & MODAL -->
  <button class="feedback-btn" onclick="toggleFeedback(true)">💬 Give Feedback</button>

  <div id="feedback-modal">
    <div class="modal-content">
      <span class="close-modal" onclick="toggleFeedback(false)">&times;</span>
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd79x7zS1NlU-5eyI_v21SdrySaUCoaSSpfINgQ_tJCxJC9Bw/viewform?embedded=true" width="100%" height="100%" frameborder="0">Loading…</iframe>
    </div>
  </div>

  <script>
    function revealFlipbook() {
      const teaser = document.getElementById('teaser-screen');
      teaser.style.opacity = '0';
      teaser.style.visibility = 'hidden';
    }

    function toggleFeedback(show) {
      document.getElementById('feedback-modal').style.display = show ? 'flex' : 'none';
    }
  </script>
</body>
</html>
