<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ownly Operations Gazette</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #121214; }

    /* =========================================
       1. TEASER SCREEN (SCOOTER HIGHWAY)
       ========================================= */
    #teaser-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #121214;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .highway-container {
      position: relative;
      width: 100vw;
      height: 250px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .road-line {
      position: absolute;
      bottom: 30px;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
    }

    .scooter-glider {
      position: absolute;
      bottom: 25px;
      width: 280px;
      height: 180px;
      animation: driveSmooth 6s linear infinite;
    }

    @keyframes driveSmooth {
      0%   { left: -300px; }
      100% { left: 100vw; }
    }

    .wheel { animation: spinWheel 0.3s linear infinite; transform-origin: center; }
    @keyframes spinWheel { 100% { transform: rotate(360deg); } }

    .teaser-banner {
      margin-top: 25px;
      background: linear-gradient(135deg, #FF2E93, #FF6B00);
      color: white;
      padding: 16px 44px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(255, 46, 147, 0.4);
      transition: transform 0.3s ease;
      z-index: 10;
    }

    #teaser-screen:hover .teaser-banner { transform: scale(1.06); }
    .teaser-hint { color: #A1A1AA; margin-top: 14px; font-size: 14px; z-index: 10; letter-spacing: 0.5px; }

    /* =========================================
       2. FLIPHTML5 CONTAINER
       ========================================= */
    #flipbook-wrapper {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 1. INTRO / TEASER OVERLAY -->
  <div id="teaser-screen" onclick="revealFlipbook()">
    <div class="highway-container">
      <div class="road-line"></div>
      
      <div class="scooter-glider">
        <svg viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Back Wheel -->
          <g class="wheel" style="transform-origin: 90px 155px;">
            <circle cx="90" cy="155" r="22" fill="#18181B" stroke="#E4E4E7" stroke-width="6"/>
            <line x1="90" y1="133" x2="90" y2="177" stroke="#E4E4E7" stroke-width="2"/>
            <line x1="68" y1="155" x2="112" y2="155" stroke="#E4E4E7" stroke-width="2"/>
          </g>
          
          <!-- Front Wheel -->
          <g class="wheel" style="transform-origin: 230px 155px;">
            <circle cx="230" cy="155" r="22" fill="#18181B" stroke="#E4E4E7" stroke-width="6"/>
            <line x1="230" y1="133" x2="230" y2="177" stroke="#E4E4E7" stroke-width="2"/>
            <line x1="208" y1="155" x2="252" y2="155" stroke="#E4E4E7" stroke-width="2"/>
          </g>

          <!-- Yellow Scooter Frame -->
          <path d="M90 155 L120 105 L170 105 L190 155 Z" fill="#FACC15"/> <!-- Bright Yellow Body -->
          <path d="M190 155 L210 100 L230 155 Z" fill="#EAB308"/>
          <path d="M230 155 L210 85 L190 80" stroke="#D4D4D8" stroke-width="6" stroke-linecap="round"/>
          <circle cx="190" cy="80" r="8" fill="#FACC15"/> <!-- Yellow Headlight -->

          <!-- Scooter Seat -->
          <rect x="110" y="95" width="55" height="12" rx="6" fill="#27272A"/>

          <!-- Rider (Person in Pink Ownly T-Shirt) -->
          <!-- Head / Helmet -->
          <circle cx="130" cy="52" r="14" fill="#3F3F46"/>
          <path d="M130 42 A12 12 0 0 1 144 54 L130 54 Z" fill="#FF2E93"/> <!-- Pink Helmet Accent -->
          <!-- Body / Pink Ownly Shirt -->
          <path d="M115 68 C115 62, 145 62, 145 68 L148 95 L112 95 Z" fill="#FF2E93"/> 
          <!-- "OWNLY" text on t-shirt -->
          <text x="118" y="82" fill="#FFFFFF" font-size="7" font-weight="900" font-family="sans-serif">OWNLY</text>
          <!-- Arms holding handlebars -->
          <path d="M138 72 L185 80" stroke="#FF2E93" stroke-width="8" stroke-linecap="round"/>
          <circle cx="185" cy="80" r="4" fill="#FCA5A5"/> <!-- Hand -->

          <!-- Newsletter Banner Bag Attached at Back -->
          <rect x="50" y="70" width="60" height="50" rx="6" fill="#FF2E93" stroke="#FFFFFF" stroke-width="2"/>
          <text x="56" y="92" fill="#FFFFFF" font-size="9" font-weight="bold" font-family="sans-serif">NEWS</text>
          <text x="56" y="105" fill="#FFFFFF" font-size="8" font-weight="bold" font-family="sans-serif">LETTER</text>
        </svg>
      </div>
    </div>

    <div class="teaser-banner">🛵 Ownly News Letter</div>
    <div class="teaser-hint">Click anywhere to open the interactive magazine</div>
  </div>

  <!-- 2. FLIPHTML5 LIVE EMBED -->
  <div id="flipbook-wrapper">
    <iframe src="https://online.fliphtml5.com/hvxsc/1-SnF5/" allowfullscreen="true"></iframe>
  </div>

  <script>
    function revealFlipbook() {
      const teaser = document.getElementById('teaser-screen');
      teaser.style.opacity = '0';
      teaser.style.visibility = 'hidden';
    }
  </script>
</body>
</html>
